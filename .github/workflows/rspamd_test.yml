name: rspamd_test

on:
  workflow_call:
    inputs:
      platform:
        default: amd64
        type: string
      image:
        required: true
        type: string
      tag:
        required: true
        type: string
      image_asan:
        description: "ASAN image to run the identity check against (optional)"
        default: ""
        required: false
        type: string
      commit:
        description: "Full sha of the rspamd commit under test (empty: tip of tag)"
        default: ""
        required: false
        type: string
      describe:
        description: "Expected git describe of the build (empty: skip the identity check)"
        default: ""
        required: false
        type: string
      release:
        description: "True for release builds: must sit exactly on the release tag"
        default: false
        required: false
        type: boolean

jobs:
  # Verifies that the image really carries the build identity it was labelled
  # with. Runs on the runner (not inside the image) so the same script can be
  # mounted into both the release and the ASAN image.
  identity:
    runs-on: "${{ (inputs.platform == 'arm64') && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}"
    steps:
      - name: Check out source code
        if: ${{ inputs.describe != '' }}
        uses: actions/checkout@v4

      - name: Check build identity
        if: ${{ inputs.describe != '' }}
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_ASAN: ${{ inputs.image_asan }}
          EXPECTED: ${{ inputs.describe }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          for img in "${IMAGE}" "${IMAGE_ASAN}"; do
            [ -n "${img}" ] || continue
            echo "::group::identity of ${img}"
            # rspamadm lua <file> (not -e) so a failing script gives a non-zero
            # exit status; the marker guards against a silently empty run.
            # ASAN_OPTIONS: the ASAN rspamadm reports startup leaks and would
            # exit non-zero before printing the marker; irrelevant otherwise.
            docker run --rm --user root \
              -e ASAN_OPTIONS=detect_leaks=0 \
              -e IDENTITY_EXPECTED_DESCRIBE="${EXPECTED}" \
              -e IDENTITY_RELEASE="${RELEASE}" \
              -v "${GITHUB_WORKSPACE}/test/identity_check.lua:/identity_check.lua:ro" \
              --entrypoint rspamadm "${img}" lua /identity_check.lua | tee identity.out
            grep -qx 'identity-ok' identity.out
            echo "::endgroup::"
          done

      - name: Identity check skipped
        if: ${{ inputs.describe == '' }}
        run: echo "No expected describe supplied, skipping the identity check"

  rspamd_test:
    needs: [identity]
    runs-on: "${{ (inputs.platform == 'arm64') && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}"
    container:
      image: ${{ inputs.image }}
      options: --user root
    steps:
      - name: Run tests
        env:
          RSPAMD_TAG: ${{ inputs.tag }}
          RSPAMD_COMMIT: ${{ inputs.commit }}
        run: |
          apt-get update
          apt-get install -y git miltertest python3 python3-dev python3-msgpack python3-nacl python3-pip python3-psutil python3-redis python3-tornado python3-venv redis-server
          mkdir -p $GITHUB_WORKSPACE
          python3 -mvenv $GITHUB_WORKSPACE/venv --system-site-packages
          bash -c "source $GITHUB_WORKSPACE/venv/bin/activate && pip3 install --no-cache --disable-pip-version-check --no-binary :all: robotframework"
          git clone -b "${RSPAMD_TAG}" https://github.com/rspamd/rspamd.git
          if [ -n "${RSPAMD_COMMIT}" ]; then git -C rspamd checkout --detach "${RSPAMD_COMMIT}"; fi
          RSPAMD_INSTALLROOT=/usr bash -c "source $GITHUB_WORKSPACE/venv/bin/activate && robot --removekeywords wuks --exclude isbroken $GITHUB_WORKSPACE/rspamd/test/functional/cases"
