name: resolve-rspamd
description: >-
  Resolve an rspamd git ref (master or a release tag) to a full commit sha and
  compute its `git describe` string once, so every architecture build and test
  job of a run uses the same source revision and reports the same identity.

inputs:
  ref:
    description: 'rspamd branch or tag to resolve (e.g. master or 4.0.1)'
    required: true

outputs:
  commit:
    description: 'Full 40-character sha of the resolved rspamd commit'
    value: ${{ steps.r.outputs.commit }}
  describe:
    description: 'git describe --tags --long --abbrev=12 (<tag>-<n>-g<hash>)'
    value: ${{ steps.r.outputs.describe }}

runs:
  using: composite
  steps:
    - id: r
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail

        # Full history (so the distance from the last tag is right) and all
        # tags, but no blobs: they are not needed to resolve or describe.
        git clone --quiet --no-checkout --filter=blob:none https://github.com/rspamd/rspamd.git rspamd-resolve
        cd rspamd-resolve

        commit="$(git rev-parse --verify -q "refs/tags/${REF}^{commit}" \
          || git rev-parse --verify "refs/remotes/origin/${REF}^{commit}")"
        describe="$(git describe --tags --long --abbrev=12 \
          --match '[0-9]*.[0-9]*' --exclude '*-*' "${commit}")"

        if ! [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Cannot resolve rspamd ref '${REF}' to a commit (got '${commit}')"
          exit 1
        fi
        if ! [[ "${describe}" =~ ^[0-9][0-9.]*-[0-9]+-g[0-9a-f]{12,40}$ ]]; then
          echo "::error::Unexpected git describe output '${describe}' for ${commit}"
          exit 1
        fi

        echo "rspamd ${REF} -> ${commit} (${describe})"
        {
          echo "commit=${commit}"
          echo "describe=${describe}"
        } >> "$GITHUB_OUTPUT"
